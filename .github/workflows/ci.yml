name: Minimal CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python source
        run: python -m compileall -q src
      - name: Install schema test dependency
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Run focused regressions
        run: PYTHONPATH=src python -m unittest discover -s tests -q
